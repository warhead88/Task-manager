name: CI/CD Pipeline

on:
  push:
    branches: [ "Main", "main", "master" ]
  pull_request:
    branches: [ "Main", "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .
        
    - name: Run Pytest
      run: |
        pytest tests/
        
  # Опционально: шаг для линтинга (flake8/black)
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"
    - name: Install linters
      run: pip install flake8
    - name: Run flake8
      run: |
        # Игнорировать ошибки слишком длинных строк (E501)
        flake8 src tests --ignore=E501,E402,W503 --max-complexity=15
